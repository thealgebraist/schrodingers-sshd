<text x="42" y="278" font-family="monospace" font-size="8.3" fill="#14532d">• Restricted Operator Π|_{F(o)} ∈ {0,1}^{|F|×|F|} is Lower-Triangular (det = 1)!</text>
<text x="42" y="294" font-family="monospace" font-size="8.3" fill="#14532d">• Single-Fault Expected: V*_Π(129) = 905/129 = 7.0155 → V*_joint(129) = 737/129 = 5.7132</text>
<text x="42" y="310" font-family="monospace" font-size="8.3" font-weight="bold" fill="#166534">• 5-Fault Cascade (M=5): Stage-Agnostic Π = 35.56 avg → Joint O⁻¹+Π = 25.30 (-28.9%)</text>
<text x="42" y="326" font-family="monospace" font-size="8.3" fill="#15803d">• Interleaved Midpoint Variant (clean3/clean4): 19–20 fiber probes + 2–6 E2E runs!</text>
