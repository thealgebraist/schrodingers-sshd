<text x="560" y="610.5" font-family="monospace" font-size="7.5" font-weight="normal" fill="#b45309">C2_BLUE (m∈{1,6}): |F| = 9 switches</text>
<text x="782" y="610.5" font-family="monospace" font-size="7.5" font-weight="bold" fill="#166534">1 E2E + 4 fiber (110→118→121→126) = 5</text>
