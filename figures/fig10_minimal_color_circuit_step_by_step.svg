<text x="40" y="631.5" font-family="monospace" font-size="7.7" font-weight="bold" fill="#0f172a">Final Check + Total</text>
<text x="198" y="631.5" font-family="monospace" font-size="7.5" font-weight="bold" fill="#475569">L₅ = 127 → All Closed!</text>
