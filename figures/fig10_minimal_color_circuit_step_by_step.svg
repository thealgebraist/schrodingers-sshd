<text x="916" y="147" font-family="monospace" font-size="7.8" fill="#cbd5e1" text-anchor="middle">Same 8-color pattern × 16 blocks</text>
<text x="916" y="162" font-family="monospace" font-size="7.8" font-weight="bold" fill="#f87171" text-anchor="middle">Masked: k=24, 59, 93, 126 = 0!</text>
<rect x="32" y="184" width="972" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="198" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0f172a">• Kronecker Color Partition (128 switches = 16 blocks × 8):  C1_RED: m∈{0,7} (32) | C2_BLUE: m∈{1,6} (32) | C3_AMBER: m∈{2,5} (32) | C4_CYAN: m=3 (16) | C5_VIOLET: m=4 (16)</text>
<text x="44" y="211" font-family="monospace" font-size="8.4" fill="#dc2626">• Censoring &amp; Aliasing Law: probe(127) sees current halt at k*=1 and returns ONLY its color FAIL(C2_BLUE) — aliasing k*=1 with all 32 Blue switches!</text>
<rect x="20" y="240" width="485" height="205" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="34" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="bold" fill="#0f172a">STEP 2: The 3 Oracle Operations &amp; In-Band Lockout Hazard</text>
<rect x="32" y="270" width="461" height="48" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
<text x="42" y="285" font-family="monospace" font-size="9.0" font-weight="bold" fill="#0f172a">1. probe(m)  [Prefix Continuity + Fault Color Oracle]</text>
<text x="42" y="300" font-family="monospace" font-size="8.0" fill="#1e293b">• If k* > m (switches 0..m all closed): returns PASS (0).</text>
<text x="42" y="312" font-family="monospace" font-size="8.0" font-weight="bold" fill="#334155">• If k* ≤ m (halted in 0..m): returns FAIL(c(k*)) ∈ {C1..C5} (hides k*!).</text>
<rect x="32" y="324" width="461" height="48" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="42" y="339" font-family="monospace" font-size="9.0" font-weight="bold" fill="#0f172a">2. inspect(k)  [Local Switch Readout Subject to Current Flow]</text>
<text x="42" y="354" font-family="monospace" font-size="8.0" fill="#1e293b">• If k ≤ k* (current reaches switch k): returns exact state s_k ∈ {0, 1}.</text>
<text x="42" y="366" font-family="monospace" font-size="8.0" font-weight="bold" fill="#334155">• If k > k* (upstream switch k* is open): returns UNREACHABLE!</text>
<rect x="32" y="378" width="461" height="48" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="42" y="393" font-family="monospace" font-size="9.0" font-weight="bold" fill="#0f172a">3. toggle(k)  [State-Flipping Intervention: s_k ← 1 - s_k]</text>
<text x="42" y="408" font-family="monospace" font-size="8.0" fill="#1e293b">• If s_k == 0 (Open): flips 0 → 1 (Fixed!). Advances frontier L ← k + 1.</text>
<text x="42" y="420" font-family="monospace" font-size="8.0" font-weight="bold" fill="#dc2626">• If s_k == 1 (Closed): flips 1 → 0 (BREAKS WORKING SWITCH! Cuts power to >k).</text>
<rect x="520" y="240" width="500" height="205" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="534" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.0" font-weight="bold" fill="#0f172a">STEP 3: Worked Trace — How Color Projection Cuts Probes in Half</text>
<rect x="532" y="270" width="476" height="82" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="542" y="285" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1e3a8a">Wave 1 (L₀ = 0): Isolating First Open Switch k₁* = 1 via Blue Fiber F(C2_BLUE, 0)</text>
<text x="542" y="299.0" font-family="monospace" font-size="7.8" fill="#1e293b">1. E2E Check : probe(127) → FAIL(C2_BLUE). Projects 128 switches onto 32 Blue switches:</text>
<text x="542" y="309.5" font-family="monospace" font-size="7.8" fill="#1e293b">   F(C2_BLUE, 0) = [1, 6, 9, 14, 17, 22, ..., 62, 65, ..., 126]  (|F| = 32 candidates).</text>
<text x="542" y="320.0" font-family="monospace" font-size="7.8" fill="#1e293b">2. Fiber Bisect (5 probes): probe(fiber[15]=62)→FAIL | probe(fiber[7]=30)→FAIL |</text>
<text x="542" y="330.5" font-family="monospace" font-size="7.8" fill="#1e293b">   probe(fiber[3]=14)→FAIL | probe(fiber[1]=6)→FAIL | probe(fiber[0]=1)→FAIL!</text>
<text x="542" y="341.0" font-family="monospace" font-size="7.8" fill="#1e293b">3. Verify &amp; Fix: Unique Blue candidate is k*=1! inspect(1)→0 → toggle(1)→1! (L₁ ← 2)</text>
<rect x="532" y="358" width="476" height="76" rx="4" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
<text x="542" y="373" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#155e75">Wave 3 (After fixing k₂*=24, so L₂ = 25): Isolating k₃* = 59 via Cyan Fiber F(C4_CYAN, 25)</text>
<text x="542" y="387.0" font-family="monospace" font-size="7.5" fill="#1e293b">1. E2E Check : probe(127) → FAIL(C4_CYAN). Since C4_CYAN only occurs at m = k mod 8 == 3,</text>
<text x="542" y="398.0" font-family="monospace" font-size="7.5" fill="#1e293b">   suffix [25..127] projects onto 13 switches: F = [27,35,43,51,59,67,75,83,91,99,107,115,123]!</text>
<text x="542" y="409.0" font-family="monospace" font-size="7.5" fill="#1e293b">2. Fiber Bisect (4 probes): probe(fiber[6]=75)→FAIL | probe(fiber[2]=43)→PASS (L←44) |</text>
<text x="542" y="420.0" font-family="monospace" font-size="7.5" fill="#1e293b">   probe(fiber[4]=59)→FAIL | probe(fiber[3]=51)→PASS ⟹ Isolated k₃*=59! inspect(59)→0, toggle(59)→1!</text>
<rect x="20" y="457" width="1000" height="188" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="520" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12.2" font-weight="bold" fill="#0f172a" text-anchor="middle">STEP 4: Complete 5-Wave Trajectory Comparison on adversarial5 (k* ∈ {1, 24, 59, 93, 126})</text>
