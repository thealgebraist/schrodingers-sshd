<text x="500" y="43" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#ffffff" text-anchor="middle">
Computational Complexity Boundary (NP-Hard vs. P via Total Unimodularity) &amp; Convex Info-Gain Optimization
</text>
<rect x="20" y="72" width="465" height="418" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="252" y="96" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">A. Polyhedral Integrality: General Test Matrix A vs. Cascade Π</text>
<rect x="36" y="110" width="433" height="168" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="48" y="129" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">1. General Non-Cascaded Test Matrix A ∈ {0,1}^{P×n} (NP-Hard / Co-NP)</text>
<text x="48" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10.2" fill="#7f1d1d">• Reductions: Minimum Test Collection (Garey &amp; Johnson SP6) &amp; Set Cover.</text>
<text x="48" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10.2" fill="#7f1d1d">• Submatrices have det(B) ∈ {±2, ±3, ...} ⟹ LP relaxation has FRACTIONAL</text>
<text x="58" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10.2" fill="#7f1d1d">vertices (Integrality Gap = Ω(log n)); requires MILP Branch-and-Cut.</text>
<text x="48" y="193" font-family="monospace" font-size="9.2" font-weight="bold" fill="#991b1b">• Decision Tree Depth h*: NP-Complete (Inapproximable &lt; (1-o(1))ln n)</text>
<polygon points="150,268 215,222 330,232 295,268" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<circle cx="215" cy="222" r="4.5" fill="#dc2626"/>
<text x="215" y="213" font-family="monospace" font-size="8.8" font-weight="bold" fill="#dc2626" text-anchor="middle">Fractional LP Vertex x*∉ℤⁿ</text>
<circle cx="200" cy="250" r="3.5" fill="#1e293b"/>
<circle cx="250" cy="250" r="3.5" fill="#1e293b"/>
<text x="360" y="255" font-family="monospace" font-size="8.8" fill="#1e293b" text-anchor="middle">Integer MILP Hull</text>
<rect x="36" y="288" width="433" height="186" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="48" y="307" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#166534">2. Cascaded Prefix Matrix Π &amp; Difference Π⁻¹ (Totally Unimodular → in P!)</text>
<text x="48" y="324" font-family="Helvetica, Arial, sans-serif" font-size="10.2" fill="#14532d">• Consecutive-Ones Property: Every column/row of Π is a contiguous interval.</text>
<text x="48" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10.2" fill="#14532d">• Every square submatrix B of Π or Π⁻¹ has det(B) ∈ {-1, 0, +1} (TUM).</text>
<text x="48" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="bold" fill="#166534">• Hoffman–Kruskal Theorem: LP Relaxation Polytope P_LP = conv(P_MILP)!</text>
<text x="48" y="372" font-family="monospace" font-size="9.2" fill="#14532d">  Integrality Gap = 0.000 | Treewidth tw(G)=1 | Exact DP O(log D)</text>
<polygon points="165,458 195,410 295,410 325,458" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
