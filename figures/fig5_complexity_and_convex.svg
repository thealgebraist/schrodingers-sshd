<text x="762.5" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Global Concave Maximum: h₂(1/2) = 1.000 bit/probe</text>
<circle cx="611.6" cy="254.3" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<text x="623.6" y="258.3" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Linear Walk (Codex Step 3): p=1/16 → 0.337 bits!</text>
<rect x="531" y="354" width="433" height="120" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="543" y="373" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Exact Optimization Formulations (Sections 7 &amp; 8):</text>
<text x="543" y="391" font-family="monospace" font-size="9.5" fill="#1e3a8a">1. Min-Cost Fault ID (LP) : min cᵀs  s.t.  Π⁻¹ y = u_{k*}, s ∈ [0,1]ᴰ</text>
<text x="543" y="408" font-family="monospace" font-size="9.5" fill="#1e3a8a">2. Multi-Fault Set-Cover  : MILP min ∑ w_a x_a s.t. A_disc x ≥ 1</text>
<text x="543" y="425" font-family="monospace" font-size="9.5" fill="#1e3a8a">3. Max Info-Gain (Convex) : min_{w∈Δ} ∑_i (r_iᵀ b) log₂(r_iᵀ b)</text>
<text x="543" y="442" font-family="monospace" font-size="9.5" fill="#1e3a8a">4. Bellman LP Primal-Dual : max V₀ s.t. V(S) ≤ 1 + p_L V(S_L) + p_R V(S_R)</text>
<text x="543" y="460" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">• Strict concavity h₂″(p) = -1/(p(1-p)ln 2) &lt; 0 guarantees unique optimum!</text>
