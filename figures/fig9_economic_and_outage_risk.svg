<rect x="20" y="16" width="1000" height="44" rx="6" fill="#0f172a"/>
<text x="520" y="43" font-family="Helvetica, Arial, sans-serif" font-size="14.8" font-weight="bold" fill="#ffffff" text-anchor="middle">
Production Economics: Token API Costs (Low vs. Ultra) &amp; Worst-Case Infrastructure Outage Cost vs. Specialized C99
</text>
<rect x="20" y="72" width="490" height="275" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="265" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">A. Token Usage, Probe Delay &amp; Collateral Risk by Agent Tier</text>
<text x="265" y="110" font-family="monospace" font-size="9.0" fill="#475569" text-anchor="middle">Why Cheap/Low-Effort LLMs Are a False Economy in Cascaded Infrastructure</text>
<rect x="32" y="120" width="466" height="49" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="42" y="135" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="bold" fill="#dc2626">1. Low-Setting / Unverified Manual LLM (Run 0a)</text>
<text x="42" y="150" font-family="monospace" font-size="8.3" fill="#1e293b">~180k–310k tok ($0.15–$0.45) | 26 probes | 3 BLIND REPAIRS (k=22,26)</text>
<text x="42" y="163" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Result: CATASTROPHIC LOCKOUT on bst-core-rtr01 -> $540,000+ SLA Outage!</text>
<rect x="32" y="175" width="466" height="49" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="42" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="bold" fill="#d97706">2. Low/Standard-Setting HTTP Loops (clean2)</text>
<text x="42" y="205" font-family="monospace" font-size="8.3" fill="#1e293b">~420k–580k tok ($0.85–$2.10) | 69 probes + 6 runs (3.45× extra probes)</text>
<text x="42" y="218" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Result: 0 wrong repairs, but 49 wasted network probes extend MTTR delay!</text>
<rect x="32" y="230" width="466" height="49" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="245" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="bold" fill="#2563eb">3. Highest-Setting gpt-6-astra ultra (clean3 / clean4)</text>
<text x="42" y="260" font-family="monospace" font-size="8.3" fill="#1e293b">1.61M–1.89M tok ($3.30–$14.50, 43 PFLOPs) | 19–20 probes | 0 wrong</text>
<text x="42" y="273" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Result: Discovers O⁻¹∩Π math! Zero wrong repairs, but 4.2–5.3 min compute.</text>
<rect x="32" y="285" width="466" height="49" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="42" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9.8" font-weight="bold" fill="#16a34a">4. Specialized C99 / C++23 Joint Solver (O⁻¹ + Π)</text>
<text x="42" y="315" font-family="monospace" font-size="8.3" fill="#1e293b">0 tokens ($4.0×10⁻¹³, 152 int ops, 1.8 μs) | 22 fiber + 6 E2E | 0 wrong</text>
<text x="42" y="328" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Result: Deterministic 0% collateral risk + 14.4 s total network probe time!</text>
<rect x="525" y="72" width="495" height="275" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="772" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">B. Concrete Worst-Case Server Outage: Run 0a Collateral Cascade</text>
<text x="772" y="110" font-family="monospace" font-size="9.0" fill="#475569" text-anchor="middle">How Saving $3 in LLM Tokens Causes a 3.5-Hour Tier-1 Bastion Blackout</text>
<rect x="537" y="120" width="471" height="41" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
<text x="546" y="136" font-family="Helvetica, Arial, sans-serif" font-size="9.3" font-weight="bold" fill="#0f172a">t = 00:00 | Initial Incident: 5 Masked Faults Across 16-Hop SCADA Chain</text>
<text x="546" y="152" font-family="monospace" font-size="7.7" fill="#334155">True faults: k* ∈ {1 (S0), 24 (S3), 59 (S7), 93 (S11), 126 (S15)}. Hop 2 is 100% HEALTHY.</text>
<rect x="537" y="166" width="471" height="41" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="546" y="182" font-family="Helvetica, Arial, sans-serif" font-size="9.3" font-weight="bold" fill="#0f172a">t = 01:15 | Bracket-Inversion Slip on `probe 23 -> PASS_1` → Blind `repair 22`!</text>
<text x="546" y="198" font-family="monospace" font-size="7.7" fill="#334155">Agent misreads PASS_1 at k=23, skips `inspect`, and breaks k=22 (bst-core-rtr01 authorized_keys).</text>
<rect x="537" y="212" width="471" height="41" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="546" y="228" font-family="Helvetica, Arial, sans-serif" font-size="9.3" font-weight="bold" fill="#0f172a">t = 01:40 | Second Blind Mutation `repair 26` (S3:2 DNS) → Total Lockout!</text>
<text x="546" y="244" font-family="monospace" font-size="7.7" fill="#334155">Core router bst-core-rtr01 (Hop 2) now rejects ALL SSH keys (O₂), severing Hops 3..15!</text>
<rect x="537" y="258" width="471" height="41" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1.4"/>
<text x="546" y="274" font-family="Helvetica, Arial, sans-serif" font-size="9.3" font-weight="bold" fill="#ffffff">t = 01:40 – 03:45 | Out-of-Band IPMI/iDRAC Console &amp; Data-Center Recovery</text>
<text x="546" y="290" font-family="monospace" font-size="7.7" fill="#fecaca">SSH dead! SREs must mount ISO via BMC/iDRAC on Hop 2 &amp; 3, then bisect Hops 7, 11, 15.</text>
<rect x="537" y="305" width="471" height="32" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
<text x="772" y="319" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="bold" fill="#854d0e" text-anchor="middle">Unbisected Heuristic Policy (α=0.25): 99.98% Failure Rate (48.1 Wrong Edits → 28 Broken Hops!)</text>
<text x="772" y="332" font-family="monospace" font-size="7.8" fill="#713f12" text-anchor="middle">Expected Hitting Time E[τ₀] ≈ 1.4 × 10²³ steps (Permanent Data-Center Configuration Corruption)</text>
<rect x="20" y="360" width="1000" height="254" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
